# Local Postgres for Sakhi. The agent writes conversations here and the
# clinic dashboard reads them, so both apps see the same turns.
#
#   docker compose up -d
#   DATABASE_URL=postgres://sakhi:sakhi@localhost:5432/sakhi
#
# Without DATABASE_URL the apps fall back to data/sakhi-store.json, so the
# demo still runs with no Docker and no API keys.

services:
  db:
    image: postgres:16-alpine
    container_name: sakhi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sakhi
      POSTGRES_PASSWORD: sakhi
      POSTGRES_DB: sakhi
    ports:
      - "5432:5432"
    volumes:
      - sakhi-db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakhi -d sakhi"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  sakhi-db-data:
